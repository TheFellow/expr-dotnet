name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout pinned Expr oracle source
        uses: actions/checkout@v7
        with:
          repository: expr-lang/expr
          ref: 4b31df3a2e0eefec04c017a82a00e0f08541d3e4
          path: inspiration/expr
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Go oracle toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/Expr.Oracle/go.mod
          cache-dependency-path: tools/Expr.Oracle/go.sum
      - name: Derive package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Release tags must use the v<SemVer> form." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore expr-dotnet.slnx
      - name: Format and analyze
        run: dotnet format expr-dotnet.slnx --verify-no-changes --no-restore --verbosity minimal
      - name: Build
        run: dotnet build expr-dotnet.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test expr-dotnet.slnx --configuration Release --no-build
      - name: Enforce complete upstream traceability
        run: |
          python3 -m unittest discover -s conformance/scripts -p 'test_*.py'
          python3 conformance/scripts/validate_traceability.py --require-no-gaps
          python3 conformance/scripts/validate.py
      - name: Verify semport ledger
        run: .github/scripts/test_semport.sh
      - name: Run bounded fuzz gate
        run: dotnet run --project tools/Expr.Fuzz/Expr.Fuzz.csproj --configuration Release --no-build -- --iterations 100000 --seed c0ffee
      - name: Pack
        run: dotnet pack src/Expr/Expr.csproj --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }}
      - name: Restore Native AOT sample
        run: dotnet restore samples/Expr.NativeAot/Expr.NativeAot.csproj --runtime linux-x64
      - name: Publish Native AOT sample
        run: dotnet publish samples/Expr.NativeAot/Expr.NativeAot.csproj --configuration Release --runtime linux-x64 --no-restore --output artifacts/native-aot
      - name: Run Native AOT sample
        run: ./artifacts/native-aot/Expr.NativeAot
      - name: Authenticate to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
