name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore expr-dotnet.slnx
      - name: Format and analyze
        run: dotnet format expr-dotnet.slnx --verify-no-changes --no-restore --verbosity minimal

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore expr-dotnet.slnx
      - name: Build
        run: dotnet build expr-dotnet.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test expr-dotnet.slnx --configuration Release --no-build
      - name: Bounded parser fuzz smoke test
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/Expr.Fuzz/Expr.Fuzz.csproj --configuration Release --no-build -- --iterations 10000 --seed c0ffee
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Expr/Expr.csproj --configuration Release --no-build --output artifacts/packages

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Native AOT sample
        run: dotnet restore samples/Expr.NativeAot/Expr.NativeAot.csproj --runtime linux-x64
      - name: Publish Native AOT sample
        run: dotnet publish samples/Expr.NativeAot/Expr.NativeAot.csproj --configuration Release --runtime linux-x64 --no-restore --output artifacts/native-aot
      - name: Run Native AOT sample
        run: ./artifacts/native-aot/Expr.NativeAot
